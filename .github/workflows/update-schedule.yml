name: Update and deploy KBO schedule

on:
  workflow_dispatch:
  schedule:
    # 00:00, 12:00, 18:00 KST (GitHub Actions cron uses UTC)
    - cron: '0 3,9,15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-schedule.yml'
      - 'scripts/**'
      - 'schemas/**'
      - 'latest.json'
      - 'schedules/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: match-diary-schedule
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test schedule tools
        run: python -m unittest discover -s tests
      - name: Fetch current season
        run: python scripts/fetch_kbo_schedule.py --season "$(date -u +%Y)"
      - name: Validate generated data
        run: python scripts/validate_schedule.py --root .
      - name: Commit verified changes
        run: |
          if git diff --quiet -- latest.json schedules; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json schedules
          git commit -m "data: update KBO schedule"
          git push
      - name: Build Pages artifact
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
